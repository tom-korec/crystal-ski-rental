name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, format, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only has to satisfy the schema in src/env.js; nothing here signs a real session or opens the database.
      BETTER_AUTH_SECRET: ci-secret-value-that-is-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unused
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The official image ships btree_gist, which the double-booking constraint needs.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crystal_ski_rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crystal_ski_rental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Set in the environment, these take precedence over the local values in .env.test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crystal_ski_rental_test
      BETTER_AUTH_SECRET: ci-e2e-secret-value-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright migrates the database, builds and starts the app, then seeds before the specs run.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
