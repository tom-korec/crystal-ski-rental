services:
  postgres:
    image: postgres:17-alpine
    container_name: crystal-ski-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crystal_ski_rental
    ports:
      # 5433 avoids clashing with a Postgres already running on the default port.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` block until the database accepts connections.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crystal_ski_rental']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
